[project]
name = "sales-forecasting-system"
version = "1.0.0"
description = "Sales Forecasting & Business Growth Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "scipy>=1.13.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "joblib>=1.4.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=16.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
prophet = ["prophet>=1.1.5"]
dev = ["pytest>=9.0.0"]

[project.scripts]
generate-data = "data.generate_sample_data:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
